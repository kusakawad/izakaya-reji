<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>居酒屋レジ</title>
<meta name="theme-color" content="#46a0ae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="居酒屋レジ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --accent:#46a0ae; --accent-d:#2f7d89; --busy:#e8973a; --busy-bg:#fdf1e3;
  --bg:#f6f6f6; --cell:#e8e8e8; --panel:#ffffff; --text:#1e1e1e; --muted:#7a7a7a;
  --bar:#bdbdbd; --label:#6f6f6f; --line:#d6d6d6; --danger:#d9443a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161819; --cell:#272a2c; --panel:#1f2223; --text:#ececec; --muted:#9b9b9b;
    --bar:#3a3d3f; --label:#4d5153; --line:#34383a; --busy-bg:#3a2c1c;
  }
}
:root[data-theme="dark"]{
  --bg:#161819; --cell:#272a2c; --panel:#1f2223; --text:#ececec; --muted:#9b9b9b;
  --bar:#3a3d3f; --label:#4d5153; --line:#34383a; --busy-bg:#3a2c1c;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

.hd{flex:0 0 auto;background:var(--accent);color:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px}
.hd .title{flex:1;text-align:center;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .title small{font-size:13px;font-weight:400;opacity:.9;margin-left:6px}
.hbtn{background:none;border:0;color:#fff;font-size:30px;line-height:1;width:44px;height:44px}
.hbtn.sm{font-size:14px;border:1.5px solid rgba(255,255,255,.8);border-radius:8px;width:auto;height:34px;padding:0 10px}

.tabs{flex:0 0 auto;display:flex;background:var(--accent-d)}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.75);padding:10px 0;font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#fff;font-weight:700}

.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.stat{display:flex;justify-content:space-around;background:var(--bar);padding:10px 6px;font-size:13px;text-align:center}
.stat b{display:block;font-size:20px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:10px}
.tcard{background:var(--panel);border:2px solid var(--line);border-radius:10px;min-height:100px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tcard .tname{font-size:20px;font-weight:700}
.tcard .tinfo{font-size:13px;color:var(--muted)}
.tcard .tamt{font-size:16px;font-weight:700}
.tcard.busy{background:var(--busy-bg);border-color:var(--busy)}
.tcard.busy .tinfo{color:var(--busy);font-weight:700}

.lines{flex:1 1 auto;min-height:90px;overflow:auto;background:var(--bg)}
.line{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.line .ln{flex:1;min-width:0;font-size:16px}
.line .ln{background:none;border:0;padding:4px 0;text-align:left}
.line .ln small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--busy);color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.ask{font-size:14px;color:var(--accent-d);font-weight:700}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 0 4px}
.ck input{width:22px;height:22px;accent-color:var(--accent)}
.ck small{display:block;color:var(--muted);font-size:12px}
.sumr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.sumr small{font-size:11px;color:var(--text);opacity:.75}
.taxgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden;margin:4px 0 8px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;text-align:center;padding:9px 4px;font-size:14px;color:var(--accent-d);background:var(--panel)}
.seg input:checked+span{background:var(--accent);color:#fff;font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-3px}
.seg.big span{padding:12px 4px;font-size:16px}
.seg label+label span{border-left:1.5px solid var(--accent)}
.taxline{text-align:center;color:var(--muted);font-size:12px;margin:-8px 0 12px}
.mini{white-space:nowrap}
.pricerow{display:flex;gap:8px;align-items:flex-end}
.pricerow .fl{flex:1;min-width:0}
.pm{flex:0 0 auto;margin-bottom:12px;height:48px;min-width:64px;border:1.5px solid var(--line);border-radius:8px;background:var(--cell);font-size:17px;font-weight:700}
input.neg{color:var(--danger);font-weight:700}
.salebtns{display:flex;gap:8px;margin-top:8px}
.logobox{display:flex;align-items:center;justify-content:center;min-height:70px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;padding:10px;margin-bottom:4px}
.logobox img{max-width:70%;max-height:120px}
.rprev{background:#d9d9d9;border-radius:10px;padding:14px 8px;display:flex;justify-content:center;max-height:55vh;overflow:auto}
.rprev img{width:100%;height:auto;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff}
.note.warn{color:var(--danger)}
.cathd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.cathd .mini{margin-bottom:4px}
.clipbar{display:flex;align-items:center;gap:8px;background:var(--busy-bg);border:1.5px solid var(--busy);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.clipbar small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.addrow.paste{border-style:solid;border-color:var(--busy);color:var(--busy);background:var(--busy-bg)}
.txt{width:100%;font:inherit;font-size:15px;line-height:1.5;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical;margin-bottom:10px}
.prev{font-size:14px;line-height:1.6}
.prev .bad{color:var(--danger);font-size:12px;margin-top:4px;word-break:break-all}
.csvbtns{display:flex;gap:8px;margin:12px 0 4px}
.csvbtns button{flex:1;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent-d);border-radius:10px;padding:11px 6px;font-size:14px;font-weight:700}
.csvbtns button:disabled{opacity:.4}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.lsub{width:76px;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}

.sumbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--bar);padding:6px 14px;font-size:28px;font-variant-numeric:tabular-nums}
.sumbar span:first-child{font-size:24px}

.cats{flex:0 0 auto;display:flex;gap:4px;padding:6px 6px 0;overflow-x:auto}
.cats button{flex:1;min-width:76px;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:8px 8px 0 0;padding:7px 4px;font-size:14px;font-weight:700}
.cats button.on{background:var(--accent);color:#fff}

.igrid{flex:0 0 auto;max-height:42vh;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;background:var(--bg)}
.item{background:var(--cell);border:0;height:86px;padding:0 0 8px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;min-width:0}
.item:active{filter:brightness(.88)}
.iname{margin-top:20px;background:var(--label);color:#fff;font-weight:800;font-size:13px;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.iprice{font-size:17px;font-variant-numeric:tabular-nums}
.igrid .empty{grid-column:1/-1}

.foot{flex:0 0 auto;display:flex;gap:8px;padding:8px}
.foot .sp{flex:1}
.foot button{border:0;border-radius:12px;background:var(--cell);padding:14px 18px;font-size:17px}
.foot button:disabled{opacity:.4}
.primary{background:var(--accent)!important;color:#fff!important;font-weight:700}
.ghost{background:var(--panel)!important;border:1.5px solid var(--line)!important}
.danger{background:var(--danger)!important;color:#fff!important}

.sec{padding:12px}
.sec h2{font-size:16px;margin:8px 0;color:var(--accent-d)}
.sec h3{font-size:13px;margin:14px 0 4px;color:var(--muted);font-weight:600}
.cards4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--panel);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kpi small{color:var(--muted);font-size:12px}
.kpi div{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);font-size:14px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.sale{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sale .top{display:flex;justify-content:space-between;font-weight:700}
.sale .det{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.row{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:12px;text-align:left;font-size:15px}
.row .grow{flex:1}
.row .muted{color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.mini:disabled{opacity:.35}
.addrow{width:100%;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:8px;padding:10px;margin-top:6px;font-weight:700}
.wide{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;background:var(--cell);font-size:15px}
.note{color:var(--muted);font-size:12px;line-height:1.6}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.show{display:flex}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:400px;max-height:90%;overflow:auto}
.modal h3{margin:0;background:var(--accent);color:#fff;text-align:center;padding:14px;font-size:18px;font-weight:600}
.mb{padding:14px}
.mbtns{display:flex;gap:8px;padding:0 14px 14px}
.mbtns button{flex:1;border:0;border-radius:10px;padding:13px 6px;background:var(--cell);font-size:15px}
.mbtns button:disabled{opacity:.4}
.fl{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.fl input,.fl select{display:block;width:100%;margin-top:4px;font-size:20px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.paytot{text-align:center;font-size:40px;font-weight:700;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 2px;font-size:14px}
.chg{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;padding:10px 4px;border-top:1px solid var(--line)}
.chg b{font-size:28px;font-variant-numeric:tabular-nums}
.chg b.short{color:var(--danger);font-size:20px}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:54px;font-size:20px;font-weight:700}
.msg{font-size:16px;line-height:1.6;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="ov"><div class="modal" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script>
const KEY='izakaya-reji-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const yen=n=>(n<0?'-¥':'¥')+Math.abs(n).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

function defaults(){
  const cats=['ドリンク','フード','その他'].map(name=>({id:uid(),name}));
  const it=(name,price,ci)=>({id:uid(),name,price,cat:cats[ci].id});
  return {
    cats,
    items:[
      it('生ビール',600,0),it('ハイボール',500,0),it('レモンサワー',480,0),it('日本酒 一合',700,0),
      it('焼酎',500,0),it('ウーロン茶',300,0),it('コーラ',300,0),
      it('枝豆',380,1),it('唐揚げ',680,1),it('焼き鳥盛り',980,1),it('だし巻き玉子',580,1),
      it('刺身三点盛り',1280,1),it('ポテトフライ',450,1),it('冷奴',350,1),
      it('お通し',300,2),it('〆ラーメン',750,2),it('アイス',300,2)
    ],
    tables:['C1','C2','C3','C4','T1','T2','T3','T4','座敷1','座敷2']
      .map(n=>({id:uid(),name:n,open:false,guests:0,start:0,lines:[],stack:[]})),
    sales:[],
    tax:defTax()
  };
}
/* 税設定: main=標準税率 sub=サブ税率 mode=価格の扱い(incMain/incSub/excl) round=端数処理 */
/* 店舗情報（レシート・領収書に印字）。paper=用紙幅(mm) */
function defShop(){return {name:'',addr:'',tel:'',regno:'',footer:'またのご来店をお待ちしております',tadashi:'御飲食代として',logo:'',paper:58};}
function defTax(){return {main:10,mainName:'店内',sub:8,subName:'持ち帰り',mode:'incMain',round:'floor'};}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.items)||!Array.isArray(S.tables)) S=defaults();
/* 古い形式のデータを今の形に補完する（読み込み時・バックアップ復元時の両方で使う） */
function normalize(D){
  if(!Array.isArray(D.cats)||!D.cats.length) D.cats=['ドリンク','フード','その他'];
  // v1: cats は名前の配列、item.cat は番号 → v2: cats は {id,name}、item.cat はカテゴリid
  const old=D.cats.map(c=>typeof c==='string'?null:c);
  D.cats=D.cats.map(c=>typeof c==='string'?{id:uid(),name:c}:{id:c.id||uid(),name:String(c.name||'カテゴリ')});
  D.items.forEach(i=>{
    if(typeof i.cat==='number'||/^\d+$/.test(String(i.cat))){const c=D.cats[+i.cat];if(c&&!old[+i.cat])i.cat=c.id;}
    if(!D.cats.some(c=>c.id===i.cat))i.cat=D.cats[0].id;
  });
  D.tables.forEach(t=>{t.lines=t.lines||[];t.stack=t.stack||[];let fix=false;
    t.lines.forEach(l=>{if(!l.key){l.key=l.iid+'@'+l.price;fix=true;}if(l.base==null)l.base=l.price;});if(fix)t.stack=[];});
  D.sales=D.sales||[];
  D.tax=Object.assign(defTax(),D.tax||{});
  D.shop=Object.assign(defShop(),D.shop||{});
  return D;
}
normalize(S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let view={name:'tables'};
let curCat=0, pendingT=null, editId=null, confirmFn=null, scrollLinesBottom=false;

const total=t=>t.lines.reduce((a,l)=>a+l.price*l.qty,0);
const count=t=>t.lines.reduce((a,l)=>a+l.qty,0);
const pct=n=>(Math.round(n*100)/100)+'%';
const rateName=k=>k==='sub'?S.tax.subName:S.tax.mainName;
function rnd(x){const m=S.tax.round,e=1e-9;return m==='ceil'?Math.ceil(x-e):m==='round'?Math.round(x):(x<0?-Math.floor(-x+e):Math.floor(x+e));}
/* 価格合計 base（メニューに入力した価格の合計）から、選んだ税率(kind)での支払額と税額を出す。
   端数処理は会計1回につき1度だけ行う */
function calcBill(base,kind){
  const tx=S.tax, r=kind==='sub'?tx.sub:tx.main;
  let total,tax;
  if(tx.mode==='excl'){tax=rnd(base*r/100);total=base+tax;}
  else{
    const inc=tx.mode==='incSub'?tx.sub:tx.main;
    total=inc===r?base:rnd(base*(100+r)/(100+inc));
    tax=rnd(total*r/(100+r));
  }
  return {kind,name:rateName(kind),rate:r,mode:tx.mode,base,total,tax};
}
const billT=(t,k='main')=>calcBill(total(t),k);
const modeLabel=m=>m==='excl'?'税抜':m==='incSub'?`${S.tax.subName}${pct(S.tax.sub)}込`:`${S.tax.mainName}${pct(S.tax.main)}込`;
const curT=()=>S.tables.find(t=>t.id===view.tid);
const mins=t=>Math.max(0,Math.floor((Date.now()-t.start)/60000));
const fmtMin=m=>m<60?m+'分':Math.floor(m/60)+'時間'+(m%60)+'分';
const pad=n=>String(n).padStart(2,'0');
const fmtTime=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ---------- views ---------- */
function shell(body,v){
  return `<header class="hd"><div class="title">居酒屋レジ</div></header>
  <nav class="tabs">${[['tables','テーブル'],['history','売上'],['settings','設定']]
    .map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${k===v?'on':''}">${l}</button>`).join('')}</nav>
  <main class="scroll" data-keep="main">${body}</main>`;
}
function tablesView(){
  const busy=S.tables.filter(t=>t.open);
  const unpaid=busy.reduce((a,t)=>a+billT(t).total,0);
  const guests=busy.reduce((a,t)=>a+(t.guests||0),0);
  return `<div class="stat"><div>使用中<b>${busy.length}/${S.tables.length}</b></div><div>客数<b>${guests}名</b></div><div>未会計<b>${yen(unpaid)}</b></div></div>
  <div class="tgrid">${S.tables.map(t=>`<button class="tcard ${t.open?'busy':''}" data-a="table" data-id="${t.id}">
    <div class="tname">${esc(t.name)}</div>
    ${t.open?`<div class="tinfo">${t.guests?t.guests+'名 ':''}${fmtMin(mins(t))}</div><div class="tamt">${yen(billT(t).total)}</div>`:`<div class="tinfo">空席</div>`}
  </button>`).join('')}</div>`;
}
function orderView(t){
  if(!(curCat<S.cats.length))curCat=0;
  const cid=S.cats[curCat].id, items=S.items.filter(i=>i.cat===cid);
  return `<header class="hd"><button class="hbtn" data-a="back" aria-label="テーブル一覧に戻る">‹</button>
    <div class="title">${esc(t.name)}<small>${t.guests?t.guests+'名':'人数未設定'} ${fmtMin(mins(t))}</small></div>
    <button class="hbtn sm" data-a="guests">人数</button></header>
  <div class="lines" data-keep="lines">${t.lines.length?t.lines.map(l=>`<div class="line">

function render(){
  const keep={};
  document.querySelectorAll('[data-keep]').forEach(el=>keep[el.dataset.keep]=el.scrollTop);
  const key=view.name+(view.tid||'')+(view.name==='order'?curCat:'');
  const same=key===render.last; render.last=key;
  if(view.name==='order'){
    const t=curT();
    if(!t){view={name:'tables'};return render();}
    $('app').innerHTML=orderView(t);
  }else{
    const body=view.name==='history'?historyView():view.name==='settings'?settingsView():tablesView();
    $('app').innerHTML=shell(body,view.name);
  }
  if(same) document.querySelectorAll('[data-keep]').forEach(el=>{if(keep[el.dataset.keep]!=null)el.scrollTop=keep[el.dataset.keep]});
  if(scrollLinesBottom){const l=document.querySelector('.lines');if(l)l.scrollTop=l.scrollHeight;scrollLinesBottom=false;}
}

}

const z2h=s=>s.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[－−]/g,'-');
function parseMenu(text,defCid){
  const out={rows:[],bad:[],newCats:[]};
  let cur=null; // 見出しで指定されたカテゴリ名（なければ追加先の既定カテゴリ）
  text.split(/\r?\n/).forEach(raw=>{
    const line=z2h(raw).trim(); if(!line)return;
    const h=line.match(/^[【\[［#＃■]\s*([^】\]］]+?)\s*[】\]］]?$/);
    if(h&&!/[\t,，、]\s*[¥￥]?\s*-?\d/.test(line)){cur=h[1].trim();if(cur&&!S.cats.some(c=>c.name===cur)&&!out.newCats.includes(cur))out.newCats.push(cur);return;}
    const m=line.match(/^(.+?)[\t,，、\s]+[¥￥]?\s*(-?[\d,，]+)\s*円?(?:[\t,，、\s]+(時価|価格入力))?$/);
    if(!m){out.bad.push(raw.trim());return;}
    const name=m[1].trim().slice(0,20), price=parseInt(m[2].replace(/[,，]/g,''));
    if(!name||isNaN(price)){out.bad.push(raw.trim());return;}
    out.rows.push({name,price,ask:!!m[3],catName:cur});
  });
  // 追加か更新か（同じカテゴリに同じ品名があれば価格を更新）
  out.rows.forEach(r=>{
    const c=r.catName?S.cats.find(x=>x.name===r.catName):S.cats.find(x=>x.id===defCid);
    r.exists=!!(c&&S.items.some(i=>i.cat===c.id&&i.name===r.name));
  });
  return out;
}

function applyText(){
  const defCid=$('txtcat').value, p=parseMenu($('txtin').value,defCid);
  let add=0,upd=0;
  p.newCats.forEach(n=>S.cats.push({id:uid(),name:n.slice(0,12)}));

    const c=r.catName?S.cats.find(x=>x.name===r.catName||x.name===r.catName.slice(0,12)):S.cats.find(x=>x.id===defCid);

  });

}

/* ==========================================================
   レシート・領収書
   様式：国税庁インボイスQ&A 問58「適格簡易請求書」の記載例に準拠
   ① 発行者名＋登録番号 ② 年月日 ③ 品目（軽減税率対象は※）
   ④ 税率ごとの対象額（税込） ⑤ 適用税率と消費税額（両方記載）
   画像として描いてPDFにし、共有画面から印刷アプリ等へ渡す
   ========================================================== */
const dayKey=ts=>{const d=new Date(ts);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;};
function nextSaleNo(ts){const k=dayKey(ts);return `${k}-${String(S.sales.filter(x=>dayKey(x.end)===k).length+1).padStart(4,'0')}`;}
function saleNo(x){if(x.no)return x.no;const k=dayKey(x.end);const same=S.sales.filter(s=>dayKey(s.end)===k);return `${k}-${String(same.indexOf(x)+1).padStart(4,'0')}`;}
const WD='日月火水木金土';
const jpDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const yenR=n=>(n<0?'-¥':'¥')+Math.abs(n).toLocaleString('ja-JP');

let logoImg=null, logoSrc='';
function getLogo(){
  if(!S.shop.logo)return Promise.resolve(null);
  if(logoImg&&logoSrc===S.shop.logo)return Promise.resolve(logoImg);
  return new Promise(res=>{const im=new Image();im.onload=()=>{logoImg=im;logoSrc=S.shop.logo;res(im);};im.onerror=()=>res(null);im.src=S.shop.logo;});
}
/* ロゴ：白黒（グレー）にして横幅を印字幅に収め、PNGで保存 */
function loadLogo(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
      const maxW=576,maxH=240,sc=Math.min(1,maxW/im.width,maxH/im.height);
      const w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
      const d=g.getImageData(0,0,w,h),p=d.data;
      for(let i=0;i<p.length;i+=4){const y=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=p[i+1]=p[i+2]=y;}
      g.putImageData(d,0,0);
      S.shop.logo=c.toDataURL('image/png'); logoImg=null; save(); render(); toast('ロゴを設定しました');
    };im.onerror=()=>toast('画像を読み込めませんでした');im.src=fr.result;};
  fr.readAsDataURL(file);
}

/* 印字内容を「行の命令」の並びにする */
function receiptOps(x,kind){
  const sh=S.shop, ops=[], hasTax=x.taxRate!=null;
  const reduced=hasTax&&x.taxKind==='sub'&&x.taxRate<S.tax.main;
  const head=()=>{
    if(sh.logo)ops.push({t:'logo'});
    if(sh.name)ops.push({t:'text',s:sh.name,a:'c',z:1.5,b:1});
    if(sh.addr)ops.push({t:'text',s:sh.addr,a:'c',z:.85});
    if(sh.tel)ops.push({t:'text',s:'TEL '+sh.tel,a:'c',z:.85});
    if(sh.regno)ops.push({t:'text',s:'登録番号 '+sh.regno,a:'c',z:.85});
  };
  const taxBlock=()=>{
    if(!hasTax)return;
    ops.push({t:'lr',l:`${pct(x.taxRate)}対象${reduced?'（軽減）':''}`,r:yenR(x.total)});
    ops.push({t:'lr',l:'　内消費税等',r:yenR(x.tax)});
  };
  if(kind==='ryo'){
    if(sh.logo)ops.push({t:'logo'});
    ops.push({t:'title',s:'領 収 書'});
    ops.push({t:'gap',h:.6});
    ops.push({t:'text',s:jpDate(x.end),a:'r',z:.85});
    ops.push({t:'gap',h:.6});
    ops.push({t:'amount',s:yenR(x.total)+'-'});
    ops.push({t:'text',s:'但　'+(sh.tadashi||'御飲食代として'),a:'l'});
    ops.push({t:'text',s:'上記正に領収いたしました',a:'l',z:.85});
    ops.push({t:'rule'});
    ops.push({t:'text',s:'＜内訳＞',a:'l',z:.85});
    taxBlock();
    if(reduced)ops.push({t:'text',s:'※軽減税率（'+pct(x.taxRate)+'）対象',a:'l',z:.8});
    if(x.total>=50000)ops.push({t:'stamp'});
    ops.push({t:'rule'});
    if(sh.name)ops.push({t:'text',s:sh.name,a:'l',z:1.15,b:1});
    if(sh.addr)ops.push({t:'text',s:sh.addr,a:'l',z:.85});
    if(sh.tel)ops.push({t:'text',s:'TEL '+sh.tel,a:'l',z:.85});
    if(sh.regno)ops.push({t:'text',s:'登録番号 '+sh.regno,a:'l',z:.85});
    ops.push({t:'text',s:'No.'+saleNo(x),a:'l',z:.8});
    return ops;
  }
  head();
  ops.push({t:'gap',h:.6});
  ops.push({t:'text',s:jpDate(x.end),a:'l',z:.9});
  ops.push({t:'lr',l:'No.'+saleNo(x),r:`${x.table}${x.guests?'　'+x.guests+'名':''}`,z:.9});
  ops.push({t:'rule'});
  x.lines.forEach(l=>{
    const base=l.base??l.price, tag=l.price===base?'':(l.price===0?'（サービス）':'（値引）');
    const nm=l.name+(reduced?' ※':'')+tag;
    if(l.qty===1)ops.push({t:'lr',l:nm,r:yenR(l.price)});
    else{ops.push({t:'text',s:nm,a:'l'});ops.push({t:'lr',l:`　${yenR(l.price)} × ${l.qty}`,r:yenR(l.price*l.qty)});}
  });
  ops.push({t:'rule'});
  const cnt=x.lines.reduce((a,l)=>a+l.qty,0);
  if(hasTax&&x.base!=null&&x.base!==x.total){
    if(x.priceMode==='excl'){ops.push({t:'lr',l:`小計（税抜）　${cnt}点`,r:yenR(x.base)});ops.push({t:'lr',l:`消費税（${pct(x.taxRate)}）`,r:yenR(x.total-x.base)});}
    else{ops.push({t:'lr',l:`小計　${cnt}点`,r:yenR(x.base)});ops.push({t:'lr',l:`${x.taxName}（${pct(x.taxRate)}）適用`,r:yenR(x.total-x.base)});}
  }else ops.push({t:'lr',l:`点数`,r:`${cnt}点`,z:.9});
  ops.push({t:'lr',l:'合　計',r:yenR(x.total),z:1.45,b:1});
  taxBlock();
  ops.push({t:'gap',h:.3});
  ops.push({t:'lr',l:'お預り',r:yenR(x.paid)});
  ops.push({t:'lr',l:'お　釣',r:yenR(x.change)});
  if(reduced)ops.push({t:'text',s:'※印は軽減税率対象商品',a:'l',z:.8});
  if(sh.footer){ops.push({t:'gap',h:.8});ops.push({t:'text',s:sh.footer,a:'c',z:.85});}
  return ops;
}

/* 命令の並びを、プリンターの印字幅（8ドット/mm）に合わせてキャンバスに描く */
const RFONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif';
function drawReceipt(ops,logo){
  const paper=+S.shop.paper===80?80:58, dots=paper===80?576:384, SC=2;
  const W=dots*SC, PAD=8*SC, FS=24*SC, LH=1.38;
  const c=document.createElement('canvas'), g=c.getContext('2d');
  const font=(z=1,b=0)=>`${b?'700':'400'} ${Math.round(FS*z)}px ${RFONT}`;
  const wrap=(s,z,b,maxW)=>{g.font=font(z,b);const out=[];let cur='';for(const ch of String(s)){if(g.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;}out.push(cur);return out;};
  const inner=W-PAD*2;
  // 1回目：高さを計算しつつ描画手順を作る
  const steps=[]; let y=PAD;
  for(const o of ops){
    const z=o.z||1, lh=FS*z*LH;
    if(o.t==='gap'){y+=FS*(o.h||1);continue;}
    if(o.t==='rule'){steps.push({k:'rule',y:y+FS*.35});y+=FS*.8;continue;}
    if(o.t==='logo'&&logo){const w=Math.min(inner*.8,logo.width*SC),h=logo.height*w/logo.width;steps.push({k:'img',x:(W-w)/2,y,w,h});y+=h+FS*.4;continue;}
    if(o.t==='title'){steps.push({k:'title',s:o.s,y});y+=FS*2.6;continue;}
    if(o.t==='amount'){steps.push({k:'amount',s:o.s,y});y+=FS*3.2;continue;}
    if(o.t==='stamp'){steps.push({k:'stamp',y});y+=FS*4.6;continue;}
    if(o.t==='text'){for(const ln of wrap(o.s,z,o.b,inner)){steps.push({k:'text',s:ln,a:o.a,z,b:o.b,y});y+=lh;}continue;}
    if(o.t==='lr'){
      g.font=font(z,o.b);const rw=g.measureText(o.r).width;
      const ls=wrap(o.l,z,o.b,inner-rw-FS*.6);
      if(ls.length===1){steps.push({k:'lr',l:ls[0],r:o.r,z,b:o.b,y});y+=lh;}
      else{ls.forEach((ln,i)=>{steps.push(i===ls.length-1?{k:'lr',l:ln,r:o.r,z,b:o.b,y}:{k:'text',s:ln,a:'l',z,b:o.b,y});y+=lh;});}
      continue;
    }
  }
  c.width=W; c.height=Math.ceil(y+PAD*2);
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';g.strokeStyle='#000';g.textBaseline='top';
  for(const s of steps){
    if(s.k==='rule'){g.setLineDash([FS*.25,FS*.2]);g.lineWidth=SC*1.5;g.beginPath();g.moveTo(PAD,s.y);g.lineTo(W-PAD,s.y);g.stroke();g.setLineDash([]);}
    else if(s.k==='img')g.drawImage(logo,s.x,s.y,s.w,s.h);
    else if(s.k==='title'){g.font=font(1.7,1);g.textAlign='center';g.fillText(s.s,W/2,s.y+FS*.35);g.lineWidth=SC*2;g.strokeRect(PAD+inner*.2,s.y,inner*.6,FS*2.3);}
    else if(s.k==='amount'){g.font=font(2,1);g.textAlign='center';g.fillText(s.s,W/2,s.y+FS*.2);g.lineWidth=SC*2;g.beginPath();g.moveTo(PAD,s.y+FS*2.7);g.lineTo(W-PAD,s.y+FS*2.7);g.stroke();}
    else if(s.k==='stamp'){const bw=FS*3.6;g.lineWidth=SC*1.5;g.setLineDash([FS*.2,FS*.15]);g.strokeRect(W-PAD-bw,s.y+FS*.3,bw,bw);g.setLineDash([]);g.font=font(.75);g.textAlign='center';g.fillText('収入印紙',W-PAD-bw/2,s.y+FS*.3+bw/2-FS*.4);}
    else if(s.k==='text'){g.font=font(s.z,s.b);g.textAlign=s.a==='c'?'center':s.a==='r'?'right':'left';g.fillText(s.s,s.a==='c'?W/2:s.a==='r'?W-PAD:PAD,s.y);}
    else if(s.k==='lr'){g.font=font(s.z,s.b);g.textAlign='left';g.fillText(s.l,PAD,s.y);g.textAlign='right';g.fillText(s.r,W-PAD,s.y);}
  }
  return {canvas:c,paper,dots};
}

/* JPEG画像1枚だけのPDFを作る（ライブラリ不要・オフラインで動く）。
   ページ幅＝印字幅（58mm紙→48mm、80mm紙→72mm）で等倍印字になる */
function imagePdf(canvas,printMm){
  const jpg=atob(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
  const wPt=printMm*72/25.4, hPt=wPt*canvas.height/canvas.width, f=n=>n.toFixed(2);
  const parts=[], offs=[]; let len=0;
  const add=s=>{parts.push(s);len+=s.length;};
  const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n${body}\nendobj\n`);};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${f(wPt)} ${f(hPt)}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  offs[4]=len; add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${canvas.width}/Height ${canvas.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`); add(jpg); add('\nendstream\nendobj\n');
  const cs=`q ${f(wPt)} 0 0 ${f(hPt)} 0 0 cm /Im0 Do Q`;
  obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xref=len;
  add(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF\n`);
  const s=parts.join(''), u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}

let lastRcpt=null;
async function openReceipt(x,kind){
  const logo=await getLogo();
  const r=drawReceipt(receiptOps(x,kind),logo);
  const label=kind==='ryo'?'領収書':'レシート';
  lastRcpt={...r,name:`${label}_${saleNo(x)}.pdf`,label};
  showModal(`<h3>${label}</h3><div class="mb">
    <div class="rprev"><img src="${r.canvas.toDataURL('image/png')}" alt="${label}のプレビュー" style="max-width:${r.paper===80?300:230}px"></div>
    ${!S.shop.name&&!S.shop.regno?'<p class="note warn">店名・登録番号が未入力です。設定タブの「レシート・領収書」で入力してください。</p>':''}
    <p class="note">「共有・印刷」を押すと共有画面が開きます。印刷アプリ（SII URL Print Agentなど）や「プリント」を選んでください。</p></div>
    <div class="mbtns"><button data-a="mclose">閉じる</button><button class="primary" data-a="rshare">共有・印刷</button></div>`);
}
async function shareReceipt(){
  if(!lastRcpt)return;
  const pdf=imagePdf(lastRcpt.canvas,lastRcpt.paper===80?72:48);
  try{
    const f=new File([pdf],lastRcpt.name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  saveFile(lastRcpt.name,pdf,'application/pdf',lastRcpt.label);
}

/* ---------- order ops ---------- */
function addItem(t,iid,price){
  const it=S.items.find(i=>i.id===iid); if(!it)return;
  if(price==null)price=it.price;
  const key=iid+'@'+price;
  const l=t.lines.find(x=>x.key===key);
  if(l)l.qty++; else t.lines.push({key,iid,name:it.name,price,base:it.price,qty:1});
  t.stack.push(key);
}
function incLine(t,key){const l=t.lines.find(x=>x.key===key);if(!l)return;l.qty++;t.stack.push(key);}
function decItem(t,key,fromUndo){
  const l=t.lines.find(x=>x.key===key); if(!l)return;
  l.qty--; if(l.qty<=0)t.lines=t.lines.filter(x=>x!==l);
  if(!fromUndo){const k=t.stack.lastIndexOf(key);if(k>=0)t.stack.splice(k,1);}
}
function repriceLine(t,key,price){
  const l=t.lines.find(x=>x.key===key); if(!l||l.price===price)return;
  const nk=l.iid+'@'+price, other=t.lines.find(x=>x.key===nk);
  if(other){other.qty+=l.qty;t.lines=t.lines.filter(x=>x!==l);}
  else{l.price=price;l.key=nk;}
  t.stack=t.stack.map(k=>k===key?nk:k);
}

/* 価格入力モーダル: mode 'add'（都度入力アイテム）/ 'line'（注文済みの行） */
let priceCtx=null;
function openPrice(ctx){
  priceCtx=ctx; const t=curT();
  let name,base,cur,qty=0;
  if(ctx.mode==='add'){const it=S.items.find(i=>i.id===ctx.iid);name=it.name;base=it.price;cur=it.price;}
  else{const l=t.lines.find(x=>x.key===ctx.key);name=l.name;base=l.base;cur=l.price;qty=l.qty;}
  priceCtx.base=base;
  showModal(`<h3>${esc(name)}</h3><div class="mb">
    <div class="pricerow"><label class="fl">${ctx.mode==='add'?'価格':'1つあたりの価格'+(qty>1?`（${qty}点すべてに適用）`:'')}<input id="pval" inputmode="numeric" autocomplete="off" value="${cur}" class="${cur<0?'neg':''}"></label><button class="pm" data-a="neg" data-for="pval" aria-label="プラスとマイナスを切り替え">＋/−</button></div>
    <div class="quick"><button data-a="pp" data-v="0">サービス ¥0</button><button data-a="pp" data-v="half">半額</button><button data-a="pp" data-v="base">定価 ${yen(base)}</button></div>
    ${ctx.mode==='line'&&qty>1?'<p class="note">1点だけサービスにしたいときは、−で1つ減らしてからもう一度追加し、その行を変更してください。</p>':''}</div>
    <div class="mbtns"><button data-a="mclose">キャンセル</button><button class="primary" data-a="pok">${ctx.mode==='add'?'追加':'変更'}</button></div>`);
}

/* CSV */
const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const csvJoin=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
const fullTime=ts=>{const d=new Date(ts);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;};
function detailCSV(){
  const rows=[['会計No','会計日時','テーブル','人数','入店時刻','品名','単価','定価','数量','小計','備考','価格の扱い','税区分','税率(%)','メニュー価格計','消費税','会計合計(税込)','お預かり','おつり']];
  const ml=m=>m==='excl'?'税抜':m==='incSub'?'サブ税率込':m==='incMain'?'標準税率込':'';
  S.sales.forEach((x,i)=>x.lines.forEach((l,j)=>{
    const base=l.base??l.price, note=l.price===base?'':(l.price===0?'サービス':'価格変更'), f=j===0;
    rows.push([i+1,fullTime(x.end),x.table,x.guests||'',fullTime(x.start),l.name,l.price,base,l.qty,l.price*l.qty,note,
      f?ml(x.priceMode):'',f?(x.taxName||''):'',f?(x.taxRate??''):'',f?(x.base??x.total):'',f?(x.tax??''):'',
      f?x.total:'',f?x.paid:'',f?x.change:'']);
  }));
  return csvJoin(rows);
}
function itemCSV(){
  const agg={};
  S.sales.forEach(x=>x.lines.forEach(l=>{const a=agg[l.name]=agg[l.name]||{q:0,amt:0,svc:0};a.q+=l.qty;a.amt+=l.price*l.qty;if(l.price===0&&(l.base??0)!==0)a.svc+=l.qty;}));
  const rows=[['品名','数量','うちサービス','金額']];
  Object.entries(agg).sort((a,b)=>b[1].amt-a[1].amt).forEach(([n,a])=>rows.push([n,a.q,a.svc,a.amt]));
  const sum=S.sales.reduce((s,x)=>s+x.total,0), g=S.sales.reduce((s,x)=>s+(x.guests||0),0);
  rows.push([],['売上合計(税込)','','',sum],['会計数','','',S.sales.length],['客数','','',g],[]);
  const by={};S.sales.forEach(x=>{const k=(x.taxName||'不明')+(x.taxRate!=null?' '+x.taxRate+'%':'');const a=by[k]=by[k]||{n:0,t:0,tax:0};a.n++;a.t+=x.total;a.tax+=x.tax||0;});
  rows.push(['税区分','件数','うち消費税','税込合計']);
  Object.entries(by).forEach(([k,a])=>rows.push([k,a.n,a.tax,a.t]));
  return csvJoin(rows);
}
const saveCSV=(name,text)=>saveFile(name,'﻿'+text,'text/csv','CSV'); // BOM: Excelで文字化けしないように
async function saveFile(name,data,mime,label){
  // 1) Claude上のページ: downloads 機能
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(dl){
    try{const r=await dl.save({filename:name,data});if(r&&r.status==='saved')toast(label+'を保存しました');}
    catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'保存の確認が開いています':'この画面では保存できません');}
    return;
  }
  // 2) ホーム画面アプリ(iPhone等): 共有シート →「ファイルに保存」
  try{
    const f=new File([data],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  // 3) 通常のブラウザ: ダウンロード
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){toast('この画面では保存できません');}
}
/* バックアップ: 全データ(アイテム・テーブル・税設定・売上)をJSONで書き出し/読み込み */
function exportBackup(){
  const body=JSON.stringify({app:'izakaya-reji',version:1,exportedAt:new Date().toISOString(),data:S},null,1);
  saveFile(`居酒屋レジ_バックアップ_${stamp()}.json`,body,'application/json','バックアップ');
  try{localStorage.setItem(KEY+'-lastbackup',String(Date.now()));}catch(e){}
}
function validBackup(o){
  const d=o&&o.app==='izakaya-reji'?o.data:o;
  return d&&Array.isArray(d.items)&&Array.isArray(d.tables)&&Array.isArray(d.sales)&&Array.isArray(d.cats)?d:null;
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let d=null; try{d=validBackup(JSON.parse(r.result));}catch(e){d=null;}
    if(!d){toast('居酒屋レジのバックアップファイルではありません');return;}
    confirmBox(`バックアップから復元します。<br>今のデータ（売上${S.sales.length}件・使用中テーブル${S.tables.filter(t=>t.open).length}卓）はバックアップの内容（売上${d.sales.length}件）に置き換わります。`,()=>{
      S=normalize(d); curCat=0; clip=null;
      view={name:'tables'}; toast('復元しました');
    },'復元する',true);
  };
  r.onerror=()=>toast('ファイルを読み込めませんでした');
  r.readAsText(file);
}
function lastBackupText(){
  let ts=0; try{ts=+localStorage.getItem(KEY+'-lastbackup')||0;}catch(e){}
  return ts?'前回のバックアップ：'+fmtTime(ts):'まだバックアップしていません';
}
function resetTable(t){t.open=false;t.guests=0;t.start=0;t.lines=[];t.stack=[];}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('ov')){closeModal();return;}
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a, id=b.dataset.id, t=curT();
  switch(a){
    case 'tab': view={name:b.dataset.v}; break;
    case 'table': {const tb=S.tables.find(x=>x.id===id);
      if(tb.open){view={name:'order',tid:id};curCat=0;} else {openGuests(id,true);return;} break;}
    case 'back': view={name:'tables'}; break;
    case 'cat': curCat=+b.dataset.i; break;
    case 'add': {const it=S.items.find(i=>i.id===id);
      if(it&&it.ask){openPrice({mode:'add',iid:id});return;}
      addItem(t,id); scrollLinesBottom=true; save(); break;}
    case 'inc': incLine(t,id); save(); break;
    case 'lprice': openPrice({mode:'line',key:id}); return;
    case 'neg': {const inp=$(b.dataset.for); if(!inp)return; let v=inp.value.trim();
      v=/^[-−]/.test(v)?v.replace(/^[-−]+/,''):'-'+v; inp.value=v; markNeg(inp); inp.focus(); return;}
    case 'pp': {const v=b.dataset.v,base=priceCtx.base;
      $('pval').value=v==='base'?base:v==='half'?Math.floor(base/2):v; return;}
    case 'pok': {const raw=$('pval').value.replace(/−/g,'-').replace(/[^\d-]/g,''),p=parseInt(raw);
      if(isNaN(p)){toast('価格を数字で入力してください');return;}
      if(priceCtx.mode==='add'){addItem(t,priceCtx.iid,p);scrollLinesBottom=true;}
      else repriceLine(t,priceCtx.key,p);
      priceCtx=null; save(); closeModal(); break;}
    case 'csvd': saveCSV(`売上明細_${stamp()}.csv`,detailCSV()); return;
    case 'csvi': saveCSV(`アイテム別_${stamp()}.csv`,itemCSV()); return;
    case 'bexp': exportBackup(); setTimeout(render,300); return;
    case 'bimp': {const f=$('bfile'); if(f){f.value='';f.click();} return;}
    case 'dec': decItem(t,id); save(); break;
    case 'undo': {const iid=t.stack.pop(); if(iid)decItem(t,iid,true); save(); break;}
    case 'clear': confirmBox(`${esc(t.name)} の注文をすべて消去しますか？`,()=>{t.lines=[];t.stack=[];},'消去する',true); return;
    case 'vacate': confirmBox(`${esc(t.name)} を空席に戻しますか？`,()=>{resetTable(t);view={name:'tables'};},'空席に戻す'); return;
    case 'guests': openGuests(t.id,false); return;
    case 'g': {const tb=S.tables.find(x=>x.id===pendingT);
      if(!tb.open){tb.open=true;tb.start=Date.now();tb.lines=[];tb.stack=[];curCat=0;}
      tb.guests=+b.dataset.n; save(); closeModal(); view={name:'order',tid:tb.id}; break;}
    case 'pay': openPay(); return;
    case 'pq': {const v=b.dataset.v,inp=$('paid');
      inp.value=v==='exact'?billT(t,payKind).total:v==='0'?'':paidVal()+(+v); updChg(); return;}
    case 'payok': {const b=billT(t,payKind),tot=b.total,p=paidVal(); if(p<tot)return;
      const now=Date.now();
      const sale={id:uid(),no:nextSaleNo(now),table:t.name,guests:t.guests,start:t.start,end:now,
        taxKind:b.kind,taxName:b.name,taxRate:b.rate,priceMode:b.mode,base:b.base,tax:b.tax,
        lines:t.lines.map(l=>({name:l.name,price:l.price,base:l.base,qty:l.qty})),total:tot,paid:p,change:p-tot};
      S.sales.push(sale);
      resetTable(t); save(); closeModal(); view={name:'tables'}; render(); openDone(sale); return;}
    case 'rcpt': case 'ryo': {const x=S.sales.find(s=>s.id===id); if(x)openReceipt(x,a==='ryo'?'ryo':'rcpt'); return;}
    case 'rshare': shareReceipt(); return;
    case 'rsample': openReceipt(sampleSale(),b.dataset.v); return;
    case 'logopick': {const f=$('logofile'); if(f){f.value='';f.click();} return;}
    case 'logodel': S.shop.logo=''; logoImg=null; save(); break;
    case 'mclose': closeModal(); return;
    case 'cok': {const fn=confirmFn;confirmFn=null;closeModal();if(fn)fn();save();break;}
    case 'inew': openItem(null,b.dataset.c); return;
    case 'icopy': {const it=S.items.find(i=>i.id===editId); if(!it)return;
      clip={name:it.name,price:it.price,ask:!!it.ask}; closeModal(); toast('コピーしました。貼り付け先のカテゴリを選んでください'); break;}
    case 'paste': pasteItem(b.dataset.c); return;
    case 'clipclear': clip=null; break;
    case 'cnew': openCatName(null); return;
    case 'cren': openCatName(id); return;
    case 'csave': {const name=$('cname').value.trim(); if(!name){toast('カテゴリ名を入力してください');return;}
      if(S.cats.some(c=>c.name===name&&c.id!==editId)){toast('同じ名前のカテゴリがあります');return;}
      if(editId)S.cats.find(c=>c.id===editId).name=name; else S.cats.push({id:uid(),name});
      save(); closeModal(); break;}
    case 'cup': case 'cdown': {const i=+b.dataset.i, j=a==='cup'?i-1:i+1; if(j<0||j>=S.cats.length)return;
      [S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]]; curCat=0; save(); break;}
    case 'cdel': openCatDel(id); return;
    case 'cdelok': {const to=$('cmove').value; S.items.forEach(i=>{if(i.cat===editId)i.cat=to;});
      S.cats=S.cats.filter(c=>c.id!==editId); curCat=0; save(); closeModal(); toast('削除しました'); break;}
    case 'txtout': openTextOut(b.dataset.c); return;
    case 'txtcopy': copyText($('txtbox').value).then(ok=>toast(ok?'コピーしました':'コピーできませんでした。文字を長押しして選んでください')); return;
    case 'txtin': openTextIn(); return;
    case 'txtok': applyText(); return;
    case 'iedit': openItem(id); return;
    case 'isave': {const name=$('iname').value.trim();const raw=$('iprice').value.replace(/−/g,'-').replace(/[^\d-]/g,'');const price=parseInt(raw);
      if(!name){toast('品名を入力してください');return;}
      if(isNaN(price)){toast('価格を数字で入力してください');return;}
      const cat=$('icat').value, ask=$('iask').checked;
      if(editId){Object.assign(S.items.find(i=>i.id===editId),{name,price,cat,ask});}
      else S.items.push({id:uid(),name,price,cat,ask});
      save(); closeModal(); toast('保存しました'); break;}
    case 'idel': {const it=S.items.find(i=>i.id===editId);
      confirmBox(`「${esc(it.name)}」を削除しますか？`,()=>{S.items=S.items.filter(i=>i.id!==editId);},'削除する',true); return;}
    case 'tnew': openTableName(null); return;
    case 'tren': openTableName(id); return;
    case 'tsave': {const name=$('tname').value.trim(); if(!name){toast('テーブル名を入力してください');return;}
      if(editId)S.tables.find(x=>x.id===editId).name=name;
      else S.tables.push({id:uid(),name,open:false,guests:0,start:0,lines:[],stack:[]});
      save(); closeModal(); break;}
    case 'tdel': {const tb=S.tables.find(x=>x.id===id);
      confirmBox(`テーブル「${esc(tb.name)}」を削除しますか？`,()=>{S.tables=S.tables.filter(x=>x.id!==id);},'削除する',true); return;}
    case 'rsales': confirmBox('売上履歴をすべて消去します。<br>先に「売上」タブからCSVを保存しておくと安心です。<br>使用中のテーブルはそのまま残ります。',()=>{S.sales=[];},'リセット',true); return;
    case 'rall': confirmBox('アイテム・テーブル・売上をすべて初期状態に戻します。',()=>{S=normalize(defaults());curCat=0;clip=null;logoImg=null;view={name:'tables'};},'初期化する',true); return;
  }
  render();
});
const markNeg=el=>el.classList.toggle('neg',/^\s*[-−]/.test(el.value));
document.addEventListener('input',e=>{if(e.target.id==='iprice'||e.target.id==='pval')markNeg(e.target);if(e.target.id==='paid')updChg();if(e.target.id==='txtin')updTextPrev();});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.hasAttribute('data-pk')){payKind=el.value;updPay();return;}
  if(el.id==='bfile'){if(el.files&&el.files[0])importBackup(el.files[0]);return;}
  if(el.id==='logofile'){if(el.files&&el.files[0])loadLogo(el.files[0]);return;}
  const sk=el.dataset.shop;
  if(sk){
    let v=el.value.trim();
    if(sk==='paper')v=+v;
    if(sk==='regno'){v=v.toUpperCase().replace(/[^T\d]/g,'');if(v&&!/^T\d{13}$/.test(v))toast('登録番号は「T＋13桁の数字」です（このまま保存しました）');}
    S.shop[sk]=v; save(); if(sk==='paper')render(); else toast('保存しました'); return;
  }
  if(el.id==='txtcat'){updTextPrev();return;}
  const k=el.dataset.tax; if(!k)return;
  if(k==='main'||k==='sub'){
    const v=parseFloat(el.value.replace(/[^\d.]/g,''));
    if(isNaN(v)||v<0||v>100){toast('税率は0〜100の数字で入力してください');el.value=S.tax[k];return;}
    S.tax[k]=v;
  }else if(k==='mainName'||k==='subName'){
    const v=el.value.trim(); if(!v){el.value=S.tax[k];return;} S.tax[k]=v;
  }else S.tax[k]=el.value;
  save(); render(); toast('税の設定を保存しました');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ov').classList.contains('show'))closeModal();});
/* オフライン対応（ホーム画面アプリとして公開したときだけ有効。Claude上のページでは何もしない） */
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
/* 保存データをブラウザが勝手に消さないようにお願いする（対応ブラウザのみ） */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
setInterval(()=>{if(!$('ov').classList.contains('show')&&(view.name==='tables'||view.name==='order'))render();},30000);
render();
